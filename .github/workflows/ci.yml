name: CI

on: [pull_request]

jobs:
  commit-messages:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: '0'
    - uses: astral-sh/setup-uv@v8.3.2
      with:
        enable-cache: true
    - run: uv run cz check --rev-range origin/${{ github.base_ref }}..HEAD

  pre-commit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: '0'
    - uses: astral-sh/setup-uv@v8.3.2
      with:
        enable-cache: true
    - uses: pre-commit/action@v3.0.1
